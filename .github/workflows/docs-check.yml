name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check conflict markers and whitespace
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!LICENSE'; then
            echo "Merge-conflict markers found."
            exit 1
          fi

          # Ignore intentional Markdown hard line breaks (two trailing spaces).
          if git grep -n -I -E '[[:blank:]]+$' -- '*.yml' '*.yaml' '*.json' '*.toml' '*.py' || \
             git grep -n -I -E '[[:blank:]]{3,}$' -- '*.md'; then
            echo "Unexpected trailing whitespace found."
            exit 1
          fi

      - name: Check required root documents
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
